<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F&O Radar Pro — Live NSE Options & News Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl">
          ⚡
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white">F&O Radar Pro <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full ml-1">LIVE NSE</span></h1>
          <p class="text-xs text-slate-400">Pre-Breakout Options Scanner & Real-Time Stock News</p>
        </div>
      </div>
      <div class="text-right">
        <div id="lastUpdated" class="text-xs font-medium text-emerald-400">Loading real market feed...</div>
        <div id="scanStats" class="text-[11px] text-slate-400">Scanning Top 40 NSE F&O Stocks</div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- Filter Bar -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-3 rounded-xl border border-slate-800">
      <div class="flex gap-2">
        <button onclick="setFilter('ALL')" id="btn-ALL" class="filter-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 text-white">All Setups</button>
        <button onclick="setFilter('BULLISH')" id="btn-BULLISH" class="filter-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">🟢 Bullish (CE)</button>
        <button onclick="setFilter('BEARISH')" id="btn-BEARISH" class="filter-btn px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700">🔴 Bearish (PE)</button>
      </div>
      <input type="text" id="searchInput" onkeyup="renderDashboard()" placeholder="Search stock (e.g. BEL, RELIANCE)..." class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500 w-full sm:w-64" />
    </div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left 2 Columns: Stock Cards -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">🎯 High-Probability F&O Breakout Radar</h2>
        <div id="stocksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- Right Column: Live Stock News -->
      <div class="space-y-4">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">📰 Live Stock Market News</h2>
        <div id="newsContainer" class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800"></div>
      </div>
    </div>
  </main>

  <script>
    let marketData = { stocks: [], newsFeed: [] };
    let currentFilter = 'ALL';

    async function loadRealData() {
      try {
        const res = await fetch('./market_data.json?t=' + Date.now());
        if (!res.ok) throw new Error("Run GitHub Action first to generate market_data.json");
        marketData = await res.json();
        document.getElementById('lastUpdated').innerText = `Updated: ${marketData.lastUpdated}`;
        document.getElementById('scanStats').innerText = `Scanned ${marketData.totalScanned} NSE F&O Stocks • ${marketData.stocks.length} Setups Found`;
        renderDashboard();
      } catch (err) {
        document.getElementById('lastUpdated').innerText = "Waiting for first scanner run...";
        document.getElementById('stocksGrid').innerHTML = `
          <div class="col-span-2 bg-amber-500/10 border border-amber-500/30 rounded-xl p-6 text-amber-200 text-sm space-y-2">
            <p class="font-bold text-base">⚠️ One Final Click Needed on GitHub!</p>
            <p>Your website is live, now run your scanner once to fill it with real NSE prices:</p>
            <ol class="list-decimal ml-5 space-y-1 text-slate-300">
              <li>Go to your GitHub Repository → click the <b>Actions</b> tab at the top.</li>
              <li>Click <b>Auto Update NSE F&O Scanner</b> on the left.</li>
              <li>Click <b>Run workflow</b> → green <b>Run workflow</b> button.</li>
              <li>Wait 45 seconds and refresh this page!</li>
            </ol>
          </div>`;
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-indigo-600', 'text-white');
        b.classList.add('bg-slate-800', 'text-slate-300');
      });
      document.getElementById('btn-' + filter).classList.replace('bg-slate-800', 'bg-indigo-600');
      document.getElementById('btn-' + filter).classList.replace('text-slate-300', 'text-white');
      renderDashboard();
    }

    function renderDashboard() {
      const search = document.getElementById('searchInput').value.toUpperCase();
      const grid = document.getElementById('stocksGrid');
      const filtered = marketData.stocks.filter(s => {
        const matchesDir = currentFilter === 'ALL' || s.direction === currentFilter;
        const matchesSearch = s.ticker.includes(search) || s.name.toUpperCase().includes(search);
        return matchesDir && matchesSearch;
      });

      grid.innerHTML = filtered.map(s => {
        const isBull = s.direction === 'BULLISH';
        const badgeColor = isBull ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-rose-500/20 text-rose-300 border-rose-500/40';
        const priceColor = s.changePct >= 0 ? 'text-emerald-400' : 'text-rose-400';

        return `
          <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl p-4 flex flex-col justify-between space-y-3 transition">
            <div>
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-lg font-bold text-white">${s.ticker}</span>
                  <span class="text-xs text-slate-400 block">${s.name} • ${s.sector}</span>
                </div>
                <span class="px-2.5 py-1 rounded-md text-xs font-bold border ${badgeColor}">
                  ${isBull ? '▲ BULLISH' : '▼ BEARISH'} (${s.confidence}%)
                </span>
              </div>

              <div class="mt-3 flex items-baseline gap-2">
                <span class="text-2xl font-bold text-white">₹${s.price}</span>
                <span class="text-xs font-semibold ${priceColor}">${s.changePct >= 0 ? '+' : ''}${s.changePct}%</span>
                <span class="ml-auto text-[11px] bg-slate-800 text-indigo-300 px-2 py-0.5 rounded">${s.setup}</span>
              </div>

              <div class="mt-3 grid grid-cols-2 gap-2 text-xs bg-slate-950 p-2.5 rounded-lg border border-slate-800/80">
                <div>
                  <span class="text-slate-400 block">Action Trigger</span>
                  <span class="font-semibold text-white">${s.trigger}</span>
                </div>
                <div>
                  <span class="text-slate-400 block">Suggested Option</span>
                  <span class="font-semibold text-amber-300">${s.optionIdea}</span>
                </div>
                <div>
                  <span class="text-slate-400 block">Stop Loss</span>
                  <span class="font-semibold text-rose-400">${s.stopLoss}</span>
                </div>
                <div>
                  <span class="text-slate-400 block">Volume / RSI</span>
                  <span class="font-semibold text-slate-200">${s.volRatio}x • RSI ${s.rsi}</span>
                </div>
              </div>

              <ul class="mt-3 space-y-1 text-xs text-slate-300">
                ${s.reasons.map(r => `<li>• ${r}</li>`).join('')}
              </ul>
            </div>
          </div>
        `;
      }).join('') || `<p class="text-slate-400 text-sm col-span-2">No stocks match your filter right now.</p>`;

      const newsBox = document.getElementById('newsContainer');
      newsBox.innerHTML = (marketData.newsFeed || []).map(n => {
        const tag = n.sentiment === 'POSITIVE' ? 'text-emerald-400 bg-emerald-500/10' : (n.sentiment === 'NEGATIVE' ? 'text-rose-400 bg-rose-500/10' : 'text-slate-400 bg-slate-800');
        return `
          <div class="border-b border-slate-800 pb-3 last:border-none last:pb-0">
            <div class="flex items-center justify-between text-[11px] mb-1">
              <span class="font-bold text-indigo-400">${n.ticker}</span>
              <span class="px-1.5 py-0.5 rounded ${tag}">${n.sentiment}</span>
            </div>
            <p class="text-xs text-slate-200 leading-relaxed">${n.headline}</p>
            <span class="text-[10px] text-slate-500">${n.source} • ${n.time}</span>
          </div>
        `;
      }).join('') || `<p class="text-xs text-slate-400">News headlines will appear here once the scanner runs.</p>`;
    }

    loadRealData();
  </script>
</body>
</html>
